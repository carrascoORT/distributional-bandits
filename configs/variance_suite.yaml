experiment_name: variance_suite

horizon: 500
seeds: [101, 202, 303, 404, 505]

utility:
  name: variance

constraint:
  gamma: 0.02

algorithms:
  - name: variance_mirror_ascent
    eta0: 0.2
  - name: variance_if_ascent
    eta0: 0.2
    prior_mean: 0.0
    prior_second_moment: 1.0
    prior_count: 1.0

instances:
  - beta_mixture_4
  - beta_shifted_5
  - triangular_4
  - mixed_shapes_6

output:
  raw_dir: results/raw
  processed_dir: results/processed
  figures_dir: results/figures