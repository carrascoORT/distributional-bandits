experiment_name: variance_suite

horizon: 500
n_seeds: 10
seed_start: 100
seed_step: 100

utility:
  name: variance

constraint:
  gamma: 0.02

algorithms:
  - name: variance_mirror_ascent
    eta0: 1
  - name: variance_if_ascent
    eta0: 1
    prior_mean: 0.0
    prior_second_moment: 1.0
    prior_count: 0.5

instances:
  - beta_mixture_4
  - name: beta_8
    family: beta
    params:
      alpha: [2, 3, 4, 5, 6, 7, 8, 9]
      beta:  [9, 8, 7, 6, 5, 4, 3, 2]
      a: 0.0
      b: 1.0
  - name: gaussian_mean_spread_4
    family: gaussian
    params:
      mu: [-1.5, -0.5, 0.5, 1.5]
      sigma: [0.4, 0.4, 0.4, 0.4]
  - name: mixed_manual_5
    arms:
      - family: uniform
        a: 0.0
        b: 1.0
      - family: beta
        alpha: 2.0
        beta: 8.0
        a: 0.0
        b: 1.0
      - family: beta
        alpha: 8.0
        beta: 2.0
        a: 0.0
        b: 1.0
      - family: triangular
        left: -1.0
        mode: 0.0
        right: 1.0
      - family: gaussian
        mu: 0.75
        sigma: 0.35

output:
  save_raw: false
  raw_dir: results/raw
  processed_dir: results/processed
  figures_dir: results/figures
