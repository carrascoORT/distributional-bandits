experiment_name: variance_suite

horizon: 1500
n_seeds: 100
seed_start: 100
seed_step: 100

utility:
  name: variance

constraint:
  gamma: 0.02

algorithms:
  - name: variance_mirror_ascent
    eta0: 3
  - name: variance_if_ascent
    eta0: 3
    prior_mean: 0.0
    prior_second_moment: 1.0
    prior_count: 1.0

instances:
  - beta_mixture_4

output:
  raw_dir: results/raw
  processed_dir: results/processed
  figures_dir: results/figures
