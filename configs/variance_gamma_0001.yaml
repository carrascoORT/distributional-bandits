experiment_name: variance_main_gamma_0001

horizon: 500
n_seeds: 10
seed_start: 100
seed_step: 100

utility:
  name: variance

constraint:
  gamma: 0.001

algorithms:
  - name: variance_mirror_ascent
    eta0: 1.0

  - name: variance_if_ascent
    eta0: 1.0
    prior_mean: 0.0
    prior_second_moment: 1.0
    prior_count: 0.5

instances:
  - beta_mixture_4

output:
  save_raw: false
  raw_dir: results/raw
  processed_dir: results/processed
  figures_dir: results/figures

diagnostics:
  save_summary_table: true
  save_weight_error: true
  save_utility_gap: true
  save_cumulative_regret: true
  save_bias_norm: true
  bias_plot:
    enabled: true
    n_mc: 512