experiment_name: variance_suite_eta_grid

horizon: 500
n_seeds: 10
seed_start: 100
seed_step: 100

utility:
  name: variance

constraint:
  gamma: 0.02

eta_grid: [0.5, 1, 2, 3]

algorithms:
  - name: variance_mirror_ascent
  - name: variance_if_ascent
    prior_mean: 0.0
    prior_second_moment: 1.0
    prior_count: 0.5

instances:
  - beta_mixture_4

output:
  raw_dir: results/raw
  processed_dir: results/processed
  figures_dir: results/figures