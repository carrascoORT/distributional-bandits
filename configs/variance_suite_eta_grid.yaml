experiment_name: variance_suite_eta_grid

horizon: 2000
n_seeds: 100
seed_start: 100
seed_step: 100

utility:
  name: variance

constraint:
  gamma: 0.02

eta_grid: [0.5, 0.75, 1, 1.25, 1.5]

algorithms:
  - name: variance_mirror_ascent
  - name: variance_if_ascent
    prior_mean: 0.0
    prior_second_moment: 1.0
    prior_count: 0.5

instances:
  - beta_mixture_4
  - name: gaussian_variance_spread_4
    family: gaussian
    params:
      mu: [0.0, 0.0, 0.0, 0.0]
      sigma: [0.2, 0.5, 0.8, 1.2]

output:
  save_raw: false
  raw_dir: results/raw
  processed_dir: results/processed
  figures_dir: results/figures
