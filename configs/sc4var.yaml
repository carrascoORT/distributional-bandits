experiment_name: sc4_var

horizon: 2000
n_seeds: 500
seed_start: 100
seed_step: 100

utility:
  name: variance

constraint:
  gamma: 0.03

algorithms:
  - name: variance_mirror_ascent
    eta0: 0.5

  - name: variance_if_ascent
    eta0: 0.5
    prior_mean: 0.0
    prior_second_moment: 1.0
    prior_count: 0.5

instances:
  - name: gaussian_30_random
    family: gaussian
    params:
      mu: [0.31, 1.12, -0.08, 0.74, 0.19, 1.36, 0.52, 0.03, 0.88, 1.01,
           -0.21, 0.63, 0.27, 1.47, 0.11, 0.95, 0.41, 0.69, -0.34, 1.18,
           0.56, 0.84, 0.07, 1.29, 0.36, -0.12, 0.99, 0.22, 1.41, 0.48]
      sigma: [0.14, 0.27, 0.11, 0.22, 0.18, 0.31, 0.16, 0.09, 0.24, 0.19,
              0.13, 0.28, 0.15, 0.34, 0.10, 0.21, 0.17, 0.26, 0.12, 0.29,
              0.20, 0.23, 0.08, 0.32, 0.14, 0.11, 0.25, 0.18, 0.30, 0.16]

output:
  save_raw: false
  raw_dir: results/raw
  processed_dir: results/processed
  figures_dir: results/figures

diagnostics:
  save_summary_table: true
  save_weight_error: true
  save_utility_gap: true
  save_cumulative_regret: true
  save_bias_norm: true
  bias_plot:
    enabled: true
    n_mc: 1000
  density_plot:
    enabled: true
    seeds: [100]
    instances: [gaussian_30_random]
    algorithms:
      - variance_if_ascent
    n_grid: 500
    n_bins: 12
